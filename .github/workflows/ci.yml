name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 libxml2-utils jq

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            src/Mods/DialogueEnterConfirm/meta.lsx \
            src/Mods/DialogueEnterConfirm/ScriptExtender/Config.json \
            src/Mods/DialogueEnterConfirm/ScriptExtender/Lua/BootstrapClient.lua \
            src/Mods/DialogueEnterConfirm/ScriptExtender/Lua/Client/DialogueEnterHandler.lua; do
            test -f "$file"
          done
          jq -e '.version == "1.0.0" and .bg3.uuid == "4a2a7773-413e-4e6a-945f-8bf74f563c6a" and .engines.bg3se == ">=32"' package.json > /dev/null

      - name: Validate Lua syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            luac5.4 -p "$file"
          done < <(find src tests -name '*.lua' -type f)

      - name: Validate XML and JSON
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do xmllint --noout "$file"; done < <(find src -name '*.lsx' -type f)
          while IFS= read -r file; do jq empty "$file"; done < <(find src -name '*.json' -type f)

      - name: Run Lua behavior tests
        run: lua5.4 tests/DialogueEnterHandler.spec.lua

  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and verify release artifacts
        shell: pwsh
        run: ./build.ps1 -Version 1.0.0

      - name: Upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dialogue-enter-confirm-build
          path: releases/
